<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neon Brick Breaker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
    body { background: #080c14; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 12px; }
    .header { width: 100%; max-width: 480px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    h1 { font-size: 1.6rem; font-weight: 800; color: #ec4899; }
    .stats { display: flex; gap: 10px; }
    .stat { background: #1e293b; border: 1px solid #334155; padding: 4px 10px; border-radius: 6px; text-align: center; }
    .stat-label { font-size: 0.65rem; color: #94a3b8; text-transform: uppercase; }
    .stat-val { font-size: 1.1rem; font-weight: 700; color: #ffffff; font-variant-numeric: tabular-nums; }
    .canvas-container { position: relative; width: 100%; max-width: 480px; aspect-ratio: 4/3; border: 2px solid #ec4899; border-radius: 10px; overflow: hidden; background: #0f172a; box-shadow: 0 0 25px rgba(236, 72, 153, 0.2); }
    canvas { width: 100%; height: 100%; display: block; }
    .overlay { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.9); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; z-index: 10; }
    .overlay h2 { font-size: 2rem; font-weight: 800; color: #ec4899; }
    .btn { background: #ec4899; color: #ffffff; font-weight: 700; border: none; padding: 8px 20px; border-radius: 6px; cursor: pointer; font-size: 1rem; }
    .btn:hover { background: #db2777; }
    .hint { margin-top: 10px; font-size: 0.8rem; color: #64748b; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Neon Breakout</h1>
    <div class="stats">
      <div class="stat">
        <div class="stat-label">Score</div>
        <div class="stat-val" id="score">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Lives</div>
        <div class="stat-val" id="lives">3</div>
      </div>
    </div>
  </div>

  <div class="canvas-container">
    <canvas id="cv" width="480" height="360"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ov-title">Game Over</h2>
      <p id="ov-sub" style="color: #94a3b8;">Final Score: 0</p>
      <button class="btn" id="startBtn">Play Again</button>
    </div>
  </div>

  <div class="hint">Move mouse or drag paddle to bounce the ball</div>

  <script>
    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const overlay = document.getElementById('overlay');
    const ovTitle = document.getElementById('ov-title');
    const ovSub = document.getElementById('ov-sub');
    const startBtn = document.getElementById('startBtn');

    let paddle = { w: 80, h: 12, x: 200, y: 335, speed: 7 };
    let ball = { x: 240, y: 250, vx: 3.5, vy: -3.5, r: 6 };
    let bricks = [];
    let particles = [];
    let score = 0;
    let lives = 3;
    let isGameOver = false;

    let audioCtx = null;
    function beep(freq, dur = 0.05) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.frequency.value = freq;
        o.connect(g); g.connect(audioCtx.destination);
        g.gain.setValueAtTime(0.05, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.start(); o.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    const BRICK_ROWS = 5;
    const BRICK_COLS = 8;
    const BRICK_COLORS = ['#ef4444', '#f97316', '#eab308', '#10b981', '#06b6d4'];

    function initBricks() {
      bricks = [];
      const w = 50;
      const h = 18;
      const pad = 6;
      const offX = (cv.width - (BRICK_COLS * (w + pad) - pad)) / 2;
      const offY = 35;

      for (let r = 0; r < BRICK_ROWS; r++) {
        for (let c = 0; c < BRICK_COLS; c++) {
          bricks.push({
            x: offX + c * (w + pad),
            y: offY + r * (h + pad),
            w, h,
            color: BRICK_COLORS[r],
            alive: true,
            pts: (BRICK_ROWS - r) * 10
          });
        }
      }
    }

    function createParticles(x, y, color) {
      for (let i = 0; i < 8; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 5,
          vy: (Math.random() - 0.5) * 5,
          color,
          alpha: 1,
          size: 2 + Math.random() * 3
        });
      }
    }

    function resetBall() {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = paddle.y - 15;
      ball.vx = (Math.random() > 0.5 ? 1 : -1) * 3.5;
      ball.vy = -3.5;
    }

    function resetGame() {
      score = 0;
      lives = 3;
      scoreEl.innerText = score;
      livesEl.innerText = lives;
      isGameOver = false;
      overlay.style.display = 'none';
      paddle.x = (cv.width - paddle.w) / 2;
      initBricks();
      resetBall();
    }

    function update() {
      if (isGameOver) return;

      // Move ball
      ball.x += ball.vx;
      ball.y += ball.vy;

      // Wall bounce
      if (ball.x - ball.r <= 0) { ball.x = ball.r; ball.vx *= -1; beep(400); }
      if (ball.x + ball.r >= cv.width) { ball.x = cv.width - ball.r; ball.vx *= -1; beep(400); }
      if (ball.y - ball.r <= 0) { ball.y = ball.r; ball.vy *= -1; beep(400); }

      // Bottom death
      if (ball.y + ball.r >= cv.height) {
        lives--;
        livesEl.innerText = lives;
        beep(160, 0.2);
        if (lives <= 0) {
          isGameOver = true;
          ovTitle.innerText = 'Game Over';
          ovSub.innerText = `Final Score: ${score}`;
          overlay.style.display = 'flex';
          return;
        } else {
          resetBall();
        }
      }

      // Paddle bounce
      if (
        ball.y + ball.r >= paddle.y &&
        ball.y - ball.r <= paddle.y + paddle.h &&
        ball.x >= paddle.x &&
        ball.x <= paddle.x + paddle.w
      ) {
        ball.vy = -Math.abs(ball.vy);
        const hitOffset = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
        ball.vx = hitOffset * 5.5;
        beep(550);
      }

      // Brick collision
      let allCleared = true;
      bricks.forEach(b => {
        if (!b.alive) return;
        allCleared = false;
        if (
          ball.x + ball.r > b.x &&
          ball.x - ball.r < b.x + b.w &&
          ball.y + ball.r > b.y &&
          ball.y - ball.r < b.y + b.h
        ) {
          b.alive = false;
          ball.vy *= -1;
          score += b.pts;
          scoreEl.innerText = score;
          createParticles(b.x + b.w / 2, b.y + b.h / 2, b.color);
          beep(750, 0.08);
        }
      });

      if (allCleared) {
        isGameOver = true;
        ovTitle.innerText = 'You Win!';
        ovSub.innerText = `Outstanding! Final Score: ${score}`;
        overlay.style.display = 'flex';
        beep(900, 0.3);
      }

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.03;
        if (p.alpha <= 0) particles.splice(i, 1);
      }
    }

    function draw() {
      ctx.fillStyle = '#0a0f1d';
      ctx.fillRect(0, 0, cv.width, cv.height);

      // Bricks
      bricks.forEach(b => {
        if (!b.alive) return;
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.roundRect(b.x, b.y, b.w, b.h, 4);
        ctx.fill();
      });

      // Paddle
      ctx.fillStyle = '#38bdf8';
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#38bdf8';
      ctx.beginPath();
      ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 6);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Ball
      ctx.fillStyle = '#ffffff';
      ctx.shadowBlur = 8;
      ctx.shadowColor = '#ffffff';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Particles
      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    // Controls
    window.addEventListener('mousemove', (e) => {
      const rect = cv.getBoundingClientRect();
      const scale = cv.width / rect.width;
      const mouseX = (e.clientX - rect.left) * scale;
      paddle.x = Math.max(0, Math.min(cv.width - paddle.w, mouseX - paddle.w / 2));
    });

    window.addEventListener('touchmove', (e) => {
      const rect = cv.getBoundingClientRect();
      const scale = cv.width / rect.width;
      const touchX = (e.touches[0].clientX - rect.left) * scale;
      paddle.x = Math.max(0, Math.min(cv.width - paddle.w, touchX - paddle.w / 2));
    }, { passive: true });

    startBtn.onclick = resetGame;

    resetGame();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
