<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Minesweeper Classic</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
    body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 12px; }
    .window { background: #1e293b; border: 2px solid #334155; border-radius: 12px; padding: 14px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .top-bar { display: flex; justify-content: space-between; align-items: center; background: #0f172a; border: 2px solid #334155; border-radius: 8px; padding: 8px 16px; margin-bottom: 12px; }
    .counter { font-family: monospace; font-size: 1.4rem; font-weight: 800; color: #ef4444; background: #020617; border: 1px solid #1e293b; padding: 2px 8px; border-radius: 4px; min-width: 55px; text-align: center; }
    .face-btn { font-size: 1.5rem; background: #334155; border: 1px solid #475569; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.1s; }
    .face-btn:active { transform: scale(0.92); }
    .board { display: grid; gap: 2px; background: #334155; padding: 4px; border-radius: 8px; }
    .tile { width: 32px; height: 32px; background: #475569; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1rem; cursor: pointer; transition: background 0.1s; }
    .tile:hover { background: #64748b; }
    .tile.revealed { background: #1e293b; cursor: default; }
    .tile.mine { background: #dc2626 !important; }
    .c1 { color: #38bdf8; }
    .c2 { color: #22c55e; }
    .c3 { color: #ef4444; }
    .c4 { color: #818cf8; }
    .c5 { color: #f59e0b; }
    .c6 { color: #06b6d4; }
    .options { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; gap: 8px; }
    .flag-toggle { background: #334155; border: 1px solid #475569; color: #f8fafc; padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .flag-toggle.active { background: #eab308; color: #0f172a; border-color: #ca8a04; }
  </style>
</head>
<body>
  <div class="window">
    <div class="top-bar">
      <div class="counter" id="mineCount">010</div>
      <button class="face-btn" id="faceBtn">🙂</button>
      <div class="counter" id="timer">000</div>
    </div>

    <div class="board" id="board"></div>

    <div class="options">
      <button class="flag-toggle" id="flagBtn">🚩 Flag Mode: OFF</button>
      <span style="font-size: 0.75rem; color: #94a3b8;">Right-click or Flag Mode</span>
    </div>
  </div>

  <script>
    const ROWS = 9;
    const COLS = 9;
    const MINES = 10;

    let grid = [];
    let revealedCount = 0;
    let flags = 0;
    let timer = 0;
    let timerInterval = null;
    let isGameOver = false;
    let flagMode = false;

    const boardEl = document.getElementById('board');
    const mineCountEl = document.getElementById('mineCount');
    const timerEl = document.getElementById('timer');
    const faceBtn = document.getElementById('faceBtn');
    const flagBtn = document.getElementById('flagBtn');

    boardEl.style.gridTemplateColumns = `repeat(${COLS}, 32px)`;

    function initGame() {
      clearInterval(timerInterval);
      timer = 0;
      flags = 0;
      revealedCount = 0;
      isGameOver = false;
      timerInterval = null;
      faceBtn.innerText = '🙂';
      mineCountEl.innerText = String(MINES).padStart(3, '0');
      timerEl.innerText = '000';

      grid = [];
      for (let r = 0; r < ROWS; r++) {
        grid[r] = [];
        for (let c = 0; c < COLS; c++) {
          grid[r][c] = { r, c, isMine: false, count: 0, revealed: false, flagged: false };
        }
      }

      // Plant mines
      let planted = 0;
      while (planted < MINES) {
        const r = Math.floor(Math.random() * ROWS);
        const c = Math.floor(Math.random() * COLS);
        if (!grid[r][c].isMine) {
          grid[r][c].isMine = true;
          planted++;
        }
      }

      // Calculate counts
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (grid[r][c].isMine) continue;
          let cnt = 0;
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              const nr = r + dr, nc = c + dc;
              if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && grid[nr][nc].isMine) cnt++;
            }
          }
          grid[r][c].count = cnt;
        }
      }

      render();
    }

    function render() {
      boardEl.innerHTML = '';
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = grid[r][c];
          const div = document.createElement('div');
          div.className = 'tile' + (cell.revealed ? ' revealed' : '');
          if (cell.revealed) {
            if (cell.isMine) {
              div.className += ' mine';
              div.innerText = '💣';
            } else if (cell.count > 0) {
              div.innerText = cell.count;
              div.className += ` c${cell.count}`;
            }
          } else if (cell.flagged) {
            div.innerText = '🚩';
          }

          div.addEventListener('click', (e) => {
            if (flagMode) toggleFlag(cell);
            else clickCell(cell);
          });
          div.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            toggleFlag(cell);
          });

          boardEl.appendChild(div);
        }
      }
    }

    function startTimer() {
      if (!timerInterval) {
        timerInterval = setInterval(() => {
          timer++;
          timerEl.innerText = String(Math.min(999, timer)).padStart(3, '0');
        }, 1000);
      }
    }

    function clickCell(cell) {
      if (isGameOver || cell.revealed || cell.flagged) return;
      startTimer();

      if (cell.isMine) {
        // Boom
        isGameOver = true;
        clearInterval(timerInterval);
        faceBtn.innerText = '😵';
        // Reveal all mines
        grid.flat().forEach(c => { if (c.isMine) c.revealed = true; });
        render();
        return;
      }

      // Flood reveal
      revealCell(cell.r, cell.c);
      render();

      // Check win
      if (revealedCount === ROWS * COLS - MINES) {
        isGameOver = true;
        clearInterval(timerInterval);
        faceBtn.innerText = '😎';
      }
    }

    function revealCell(r, c) {
      if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return;
      const cell = grid[r][c];
      if (cell.revealed || cell.flagged || cell.isMine) return;

      cell.revealed = true;
      revealedCount++;

      if (cell.count === 0) {
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            revealCell(r + dr, c + dc);
          }
        }
      }
    }

    function toggleFlag(cell) {
      if (isGameOver || cell.revealed) return;
      startTimer();
      cell.flagged = !cell.flagged;
      flags += cell.flagged ? 1 : -1;
      mineCountEl.innerText = String(Math.max(0, MINES - flags)).padStart(3, '0');
      render();
    }

    flagBtn.onclick = () => {
      flagMode = !flagMode;
      flagBtn.className = 'flag-toggle' + (flagMode ? ' active' : '');
      flagBtn.innerText = `🚩 Flag Mode: ${flagMode ? 'ON' : 'OFF'}`;
    };

    faceBtn.onclick = initGame;

    initGame();
  </script>
</body>
</html>
