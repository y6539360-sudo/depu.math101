<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>2048 Classic</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
    body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; overflow: hidden; }
    .header { width: 100%; max-width: 420px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .title-box h1 { font-size: 2.2rem; font-weight: 800; color: #f59e0b; letter-spacing: -1px; }
    .title-box p { font-size: 0.8rem; color: #94a3b8; }
    .scores { display: flex; gap: 8px; }
    .score-card { background: #1e293b; border: 1px solid #334155; padding: 6px 12px; border-radius: 8px; text-align: center; min-width: 70px; }
    .score-label { font-size: 0.65rem; text-transform: uppercase; color: #94a3b8; font-weight: 600; }
    .score-val { font-size: 1.1rem; font-weight: 700; color: #ffffff; font-variant-numeric: tabular-nums; }
    .btn-bar { width: 100%; max-width: 420px; display: flex; justify-content: space-between; margin-bottom: 12px; gap: 8px; }
    .action-btn { background: #334155; hover:background: #475569; color: #f8fafc; border: none; padding: 8px 14px; border-radius: 6px; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: background 0.15s; }
    .action-btn:hover { background: #475569; }
    .action-btn.primary { background: #f59e0b; color: #0f172a; }
    .action-btn.primary:hover { background: #d97706; }
    .grid-container { width: 100%; max-width: 420px; aspect-ratio: 1; background: #1e293b; border: 2px solid #334155; border-radius: 12px; padding: 12px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; position: relative; }
    .cell { background: #0f172a; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.8rem; transition: transform 0.1s, background-color 0.1s; }
    .tile-2 { background: #334155; color: #f8fafc; }
    .tile-4 { background: #475569; color: #f8fafc; }
    .tile-8 { background: #f97316; color: #ffffff; }
    .tile-16 { background: #ea580c; color: #ffffff; }
    .tile-32 { background: #dc2626; color: #ffffff; }
    .tile-64 { background: #b91c1c; color: #ffffff; }
    .tile-128 { background: #eab308; color: #0f172a; font-size: 1.5rem; box-shadow: 0 0 10px #eab30866; }
    .tile-256 { background: #facc15; color: #0f172a; font-size: 1.5rem; box-shadow: 0 0 15px #facc1588; }
    .tile-512 { background: #f59e0b; color: #0f172a; font-size: 1.5rem; box-shadow: 0 0 20px #f59e0b99; }
    .tile-1024 { background: #10b981; color: #ffffff; font-size: 1.3rem; }
    .tile-2048 { background: #06b6d4; color: #ffffff; font-size: 1.3rem; box-shadow: 0 0 25px #06b6d4aa; }
    .overlay { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.92); border-radius: 12px; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 10; gap: 12px; }
    .overlay h2 { font-size: 2rem; font-weight: 800; color: #f8fafc; }
    .overlay p { color: #94a3b8; font-size: 0.95rem; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title-box">
      <h1>2048</h1>
      <p>Join tiles to reach 2048!</p>
    </div>
    <div class="scores">
      <div class="score-card">
        <div class="score-label">Score</div>
        <div class="score-val" id="score">0</div>
      </div>
      <div class="score-card">
        <div class="score-label">Best</div>
        <div class="score-val" id="best">0</div>
      </div>
    </div>
  </div>

  <div class="btn-bar">
    <button class="action-btn" id="undo-btn">Undo</button>
    <button class="action-btn primary" id="restart-btn">New Game</button>
  </div>

  <div class="grid-container" id="grid">
    <div class="overlay" id="overlay">
      <h2 id="overlay-title">Game Over</h2>
      <p id="overlay-msg">No more moves left!</p>
      <button class="action-btn primary" id="retry-btn">Try Again</button>
    </div>
  </div>

  <script>
    let board = Array(4).fill(null).map(() => Array(4).fill(0));
    let prevBoard = null;
    let score = 0;
    let prevScore = 0;
    let best = parseInt(localStorage.getItem('unblocked_2048_best') || '0', 10);
    document.getElementById('best').innerText = best;

    const gridEl = document.getElementById('grid');
    const scoreEl = document.getElementById('score');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayMsg = document.getElementById('overlay-msg');

    function createCells() {
      // Remove existing cells except overlay
      const cells = gridEl.querySelectorAll('.cell');
      cells.forEach(c => c.remove());
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          const div = document.createElement('div');
          div.className = 'cell';
          div.id = `cell-${r}-${c}`;
          gridEl.appendChild(div);
        }
      }
    }

    function render() {
      scoreEl.innerText = score;
      if (score > best) {
        best = score;
        localStorage.setItem('unblocked_2048_best', best);
        document.getElementById('best').innerText = best;
      }
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          const val = board[r][c];
          const cell = document.getElementById(`cell-${r}-${c}`);
          cell.innerText = val > 0 ? val : '';
          cell.className = 'cell' + (val > 0 ? ` tile-${val}` : '');
        }
      }
    }

    function addRandomTile() {
      const empty = [];
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          if (board[r][c] === 0) empty.push({ r, c });
        }
      }
      if (empty.length === 0) return;
      const spot = empty[Math.floor(Math.random() * empty.length)];
      board[spot.r][spot.c] = Math.random() < 0.9 ? 2 : 4;
    }

    function saveState() {
      prevBoard = board.map(row => [...row]);
      prevScore = score;
    }

    function slide(row) {
      let filtered = row.filter(val => val !== 0);
      for (let i = 0; i < filtered.length - 1; i++) {
        if (filtered[i] === filtered[i + 1]) {
          filtered[i] *= 2;
          score += filtered[i];
          filtered[i + 1] = 0;
        }
      }
      filtered = filtered.filter(val => val !== 0);
      while (filtered.length < 4) filtered.push(0);
      return filtered;
    }

    function move(dir) {
      saveState();
      let moved = false;
      const oldStr = JSON.stringify(board);

      if (dir === 'left') {
        for (let r = 0; r < 4; r++) board[r] = slide(board[r]);
      } else if (dir === 'right') {
        for (let r = 0; r < 4; r++) board[r] = slide(board[r].reverse()).reverse();
      } else if (dir === 'up') {
        for (let c = 0; c < 4; c++) {
          let col = [board[0][c], board[1][c], board[2][c], board[3][c]];
          col = slide(col);
          for (let r = 0; r < 4; r++) board[r][c] = col[r];
        }
      } else if (dir === 'down') {
        for (let c = 0; c < 4; c++) {
          let col = [board[3][c], board[2][c], board[1][c], board[0][c]];
          col = slide(col);
          for (let r = 0; r < 4; r++) board[3 - r][c] = col[r];
        }
      }

      if (JSON.stringify(board) !== oldStr) {
        addRandomTile();
        render();
        checkGameState();
      }
    }

    function canMove() {
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          if (board[r][c] === 0) return true;
          if (c < 3 && board[r][c] === board[r][c + 1]) return true;
          if (r < 3 && board[r][c] === board[r + 1][c]) return true;
        }
      }
      return false;
    }

    function checkGameState() {
      let has2048 = false;
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          if (board[r][c] === 2048) has2048 = true;
        }
      }
      if (has2048 && !overlay.dataset.won) {
        overlay.dataset.won = 'true';
        overlayTitle.innerText = 'You Win!';
        overlayMsg.innerText = 'You reached the 2048 tile!';
        overlay.style.display = 'flex';
      } else if (!canMove()) {
        overlayTitle.innerText = 'Game Over';
        overlayMsg.innerText = 'No more moves possible.';
        overlay.style.display = 'flex';
      }
    }

    function initGame() {
      overlay.style.display = 'none';
      delete overlay.dataset.won;
      board = Array(4).fill(null).map(() => Array(4).fill(0));
      score = 0;
      createCells();
      addRandomTile();
      addRandomTile();
      render();
    }

    document.getElementById('restart-btn').addEventListener('click', initGame);
    document.getElementById('retry-btn').addEventListener('click', initGame);
    document.getElementById('undo-btn').addEventListener('click', () => {
      if (prevBoard) {
        board = prevBoard.map(row => [...row]);
        score = prevScore;
        overlay.style.display = 'none';
        render();
      }
    });

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); move('up'); }
      else if (['ArrowDown', 'KeyS'].includes(e.code)) { e.preventDefault(); move('down'); }
      else if (['ArrowLeft', 'KeyA'].includes(e.code)) { e.preventDefault(); move('left'); }
      else if (['ArrowRight', 'KeyD'].includes(e.code)) { e.preventDefault(); move('right'); }
    });

    // Touch swipe support
    let touchStartX = 0;
    let touchStartY = 0;
    window.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });
    window.addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) {
        move(dx > 0 ? 'right' : 'left');
      } else if (Math.abs(dy) > 30) {
        move(dy > 0 ? 'down' : 'up');
      }
    }, { passive: true });

    initGame();
  </script>
</body>
</html>
