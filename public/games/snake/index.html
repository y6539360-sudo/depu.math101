<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Retro Snake</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
    body { background: #090d16; color: #f1f5f9; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 12px; }
    .header { width: 100%; max-width: 440px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .title h1 { font-size: 1.8rem; font-weight: 800; color: #10b981; }
    .stats { display: flex; gap: 8px; }
    .stat-badge { background: #1e293b; border: 1px solid #334155; padding: 6px 12px; border-radius: 8px; text-align: center; }
    .stat-lbl { font-size: 0.65rem; color: #94a3b8; text-transform: uppercase; font-weight: 600; }
    .stat-num { font-size: 1.1rem; font-weight: 700; color: #ffffff; font-variant-numeric: tabular-nums; }
    .canvas-box { position: relative; width: 100%; max-width: 440px; aspect-ratio: 1; border: 2px solid #10b981; border-radius: 12px; overflow: hidden; background: #0f172a; box-shadow: 0 0 20px rgba(16, 185, 129, 0.2); }
    canvas { width: 100%; height: 100%; display: block; }
    .overlay { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.9); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; z-index: 10; }
    .overlay h2 { font-size: 2.2rem; font-weight: 800; color: #ef4444; }
    .overlay p { color: #94a3b8; }
    .btn { background: #10b981; color: #090d16; font-weight: 700; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 1rem; transition: transform 0.1s, background 0.15s; }
    .btn:hover { background: #059669; }
    .controls-hint { margin-top: 10px; font-size: 0.8rem; color: #64748b; text-align: center; }
    .d-pad { display: grid; grid-template-columns: repeat(3, 48px); gap: 6px; margin-top: 12px; }
    .d-btn { background: #1e293b; border: 1px solid #334155; color: #f8fafc; font-size: 1.2rem; height: 48px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .d-btn:active { background: #334155; }
    @media (min-width: 640px) { .d-pad { display: none; } }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <h1>Neon Snake</h1>
    </div>
    <div class="stats">
      <div class="stat-badge">
        <div class="stat-lbl">Score</div>
        <div class="stat-num" id="score">0</div>
      </div>
      <div class="stat-badge">
        <div class="stat-lbl">High</div>
        <div class="stat-num" id="high">0</div>
      </div>
    </div>
  </div>

  <div class="canvas-box">
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="over-title">Game Over</h2>
      <p id="over-sub">You crashed into the wall!</p>
      <button class="btn" id="start-btn">Play Again</button>
    </div>
  </div>

  <div class="controls-hint">Use Arrow keys or WASD to navigate</div>

  <div class="d-pad">
    <div></div>
    <button class="d-btn" id="btn-up">↑</button>
    <div></div>
    <button class="d-btn" id="btn-left">←</button>
    <button class="d-btn" id="btn-down">↓</button>
    <button class="d-btn" id="btn-right">→</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highEl = document.getElementById('high');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('start-btn');

    const GRID = 20;
    const COUNT = canvas.width / GRID;

    let snake = [{ x: 10, y: 10 }];
    let dir = { x: 1, y: 0 };
    let nextDir = { x: 1, y: 0 };
    let food = { x: 15, y: 10, special: false };
    let score = 0;
    let high = parseInt(localStorage.getItem('snake_high') || '0', 10);
    highEl.innerText = high;
    let gameLoop = null;
    let isGameOver = false;

    // Web Audio synthesizer
    let audioCtx = null;
    function playBeep(freq, duration = 0.08) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function spawnFood() {
      let valid = false;
      while (!valid) {
        food.x = Math.floor(Math.random() * COUNT);
        food.y = Math.floor(Math.random() * COUNT);
        valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
      }
      food.special = Math.random() < 0.2;
    }

    function resetGame() {
      snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      scoreEl.innerText = score;
      isGameOver = false;
      overlay.style.display = 'none';
      spawnFood();
      clearInterval(gameLoop);
      gameLoop = setInterval(update, 110);
    }

    function gameOver(reason) {
      isGameOver = true;
      clearInterval(gameLoop);
      playBeep(180, 0.3);
      document.getElementById('over-sub').innerText = reason;
      overlay.style.display = 'flex';
    }

    function update() {
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // Wall collision
      if (head.x < 0 || head.x >= COUNT || head.y < 0 || head.y >= COUNT) {
        return gameOver('You hit the border wall!');
      }

      // Self collision
      for (let i = 0; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
          return gameOver('You collided with yourself!');
        }
      }

      snake.unshift(head);

      // Check food
      if (head.x === food.x && head.y === food.y) {
        score += food.special ? 30 : 10;
        scoreEl.innerText = score;
        if (score > high) {
          high = score;
          highEl.innerText = high;
          localStorage.setItem('snake_high', high);
        }
        playBeep(food.special ? 880 : 540);
        spawnFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      ctx.fillStyle = '#0a0f1d';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid lines
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 0.5;
      for (let i = 0; i < canvas.width; i += GRID) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
      }

      // Food
      ctx.fillStyle = food.special ? '#f59e0b' : '#ef4444';
      ctx.shadowBlur = food.special ? 12 : 8;
      ctx.shadowColor = food.special ? '#f59e0b' : '#ef4444';
      ctx.beginPath();
      ctx.arc((food.x + 0.5) * GRID, (food.y + 0.5) * GRID, GRID / 2 - 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Snake
      snake.forEach((segment, index) => {
        const isHead = index === 0;
        ctx.fillStyle = isHead ? '#34d399' : '#10b981';
        ctx.shadowBlur = isHead ? 10 : 0;
        ctx.shadowColor = '#10b981';
        ctx.beginPath();
        ctx.roundRect(segment.x * GRID + 1, segment.y * GRID + 1, GRID - 2, GRID - 2, isHead ? 6 : 4);
        ctx.fill();
        ctx.shadowBlur = 0;
      });
    }

    function setDirection(x, y) {
      if ((x !== 0 && dir.x === -x) || (y !== 0 && dir.y === -y)) return;
      nextDir = { x, y };
    }

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); setDirection(0, -1); }
      else if (['ArrowDown', 'KeyS'].includes(e.code)) { e.preventDefault(); setDirection(0, 1); }
      else if (['ArrowLeft', 'KeyA'].includes(e.code)) { e.preventDefault(); setDirection(-1, 0); }
      else if (['ArrowRight', 'KeyD'].includes(e.code)) { e.preventDefault(); setDirection(1, 0); }
      else if (e.code === 'Space' && isGameOver) { resetGame(); }
    });

    document.getElementById('btn-up').onclick = () => setDirection(0, -1);
    document.getElementById('btn-down').onclick = () => setDirection(0, 1);
    document.getElementById('btn-left').onclick = () => setDirection(-1, 0);
    document.getElementById('btn-right').onclick = () => setDirection(1, 0);
    startBtn.onclick = resetGame;

    resetGame();
  </script>
</body>
</html>
